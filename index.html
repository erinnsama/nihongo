<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日文學習區">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>日文學習區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one centered study column; home = zigzag lesson path, lesson = top bar / question / sticky answer footer */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E6EAF2; --line:#D3D9E6;
  --ink:#1B2233; --muted:#5E6880;
  --ai:#2F48A8; --ai-deep:#1F3280; --ai-soft:#DCE3FA;   /* 藍 indigo: primary */
  --shu:#E2552F; --shu-soft:#FCE4DC;                     /* 朱 vermilion: streak, hearts */
  --ok:#23955A; --ok-deep:#18723F; --ok-soft:#D9F2E4;
  --bad:#D23F3F; --bad-deep:#A52B2B; --bad-soft:#FBE0E0;
  --gold:#E8A317;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141C; --surface:#1A1F2C; --sunk:#232A3A; --line:#2F3850;
  --ink:#E7EBF5; --muted:#9AA4BD;
  --ai:#7F96FF; --ai-deep:#4D63CC; --ai-soft:#25305A;
  --shu:#FF7A55; --shu-soft:#43261E;
  --ok:#3CC47D; --ok-deep:#24894F; --ok-soft:#173A28;
  --bad:#FF6B6B; --bad-deep:#B83B3B; --bad-soft:#401E22;
  --gold:#F5BA3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2C; --sunk:#232A3A; --line:#2F3850;
  --ink:#E7EBF5; --muted:#9AA4BD;
  --ai:#7F96FF; --ai-deep:#4D63CC; --ai-soft:#25305A;
  --shu:#FF7A55; --shu-soft:#43261E;
  --ok:#3CC47D; --ok-deep:#24894F; --ok-soft:#173A28;
  --bad:#FF6B6B; --bad-deep:#B83B3B; --bad-soft:#401E22;
  --gold:#F5BA3A; color-scheme:dark}

*{box-sizing:border-box}html,body{height:100%}body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jp{font-family:var(--jp)}
ruby rt{font-size:.5em;color:var(--muted);font-family:var(--jp)}
body.nofuri ruby rt{visibility:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
svg{display:block}

/* ---------- home ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--jp);font-weight:900;font-size:1.15rem;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.hanko{width:30px;height:30px;border-radius:7px;background:var(--shu);color:#fff;display:grid;place-items:center;font-size:.95rem;font-weight:900;transform:rotate(-6deg)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.streak{color:var(--shu)} .stat.xp{color:var(--gold)}
.furi{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 10px;font-family:var(--jp);font-size:.85rem;font-weight:700}
.furi[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}

.unit{margin-top:22px;border-radius:16px;background:var(--ai);color:#fff;padding:14px 18px;box-shadow:0 4px 0 var(--ai-deep)}
.unit.u2{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep)}
.unit.u3{background:var(--shu);box-shadow:0 4px 0 color-mix(in srgb,var(--shu) 70%,#000)}
.unit small{display:block;font-size:.78rem;letter-spacing:.12em;opacity:.85;text-transform:uppercase}
.unit h2{margin:2px 0 0;font-family:var(--jp);font-size:1.25rem;font-weight:900;text-wrap:balance}
.unit p{margin:0;font-size:.9rem;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 0 8px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-weight:900;font-size:1.7rem;
  background:var(--sunk);color:var(--muted);box-shadow:0 6px 0 var(--line);transition:transform .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.done .disc{background:var(--gold);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 65%,#000)}
.node.next .disc{background:var(--ai);color:#fff;box-shadow:0 6px 0 var(--ai-deep);animation:bob 1.6s ease-in-out infinite}
.node .lbl{font-weight:700;font-size:.88rem;max-width:150px;text-align:center;line-height:1.3}
.node .stars{font-size:.75rem;color:var(--gold);height:1em;letter-spacing:2px}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot-note{color:var(--muted);font-size:.82rem;text-align:center;padding:28px 0 40px}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgb(10 14 25 / .45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgb(0 0 0 / .2)}
.sheet .wrap{padding-block:20px}
.sheet h3{margin:0;font-family:var(--jp);font-size:1.4rem;font-weight:900}
.sheet .kind{color:var(--ai);font-weight:700;font-size:.8rem;letter-spacing:.1em}
.sheet .desc{color:var(--muted);margin:4px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{margin-top:18px;border-top:2px dashed var(--line);padding-top:6px}
.note h4{font-family:var(--jp);font-size:1.05rem;margin:16px 0 4px;color:var(--ai)}
.note p,.note li{margin:4px 0}
.note .ex{font-family:var(--jp);font-size:1.08rem;background:var(--sunk);border-radius:10px;padding:8px 12px;margin:6px 0}
.note .ex span{display:block;font-family:var(--zh);font-size:.85rem;color:var(--muted)}
.note .warn{border-left:4px solid var(--shu);background:var(--shu-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.tbl{overflow-x:auto}
.note table{border-collapse:collapse;width:100%;font-size:.95rem}
.note td,.note th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.note th{color:var(--muted);font-weight:500;font-size:.8rem}
.note td.j{font-family:var(--jp);font-size:1.05rem;white-space:nowrap}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.dlg b{font-family:var(--jp);color:var(--muted);font-weight:700;white-space:nowrap}
.dlg div{font-family:var(--jp);font-size:1.05rem;min-width:0}
.dlg div span{display:block;font-family:var(--zh);font-size:.82rem;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1rem;letter-spacing:.05em;background:var(--ai);color:#fff;box-shadow:0 4px 0 var(--ai-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-deep)}
.btn.ghost{background:var(--surface);color:var(--ai);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}

/* ---------- lesson ---------- */
#lesson{display:flex;flex-direction:column;min-height:100%}
.lbar .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{border:0;background:none;color:var(--muted);padding:4px}
.prog{flex:1;height:16px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .1)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--shu);font-weight:700;font-variant-numeric:tabular-nums}
.qmain{flex:1;padding-block:8px 24px}
.qtype{font-size:.82rem;font-weight:700;color:var(--ai);letter-spacing:.08em;margin:6px 0 2px}
.qhead{font-size:1.3rem;font-weight:700;margin:0 0 16px;text-wrap:balance}
.prompt{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
.big{font-family:var(--jp);font-size:2rem;font-weight:700;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.sentence{font-family:var(--jp);font-size:1.35rem;line-height:2.2;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:20px;min-width:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ai);text-align:center;color:var(--ai);padding:0 4px;line-height:1.3}
.say{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--ai);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--ai-deep)}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-deep)}
.say.sm{width:34px;height:34px;border-radius:9px;box-shadow:0 3px 0 var(--ai-deep)}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.tile{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;
  box-shadow:0 4px 0 var(--line);font-size:1.05rem;min-height:56px;transition:transform .08s}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.tile .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.78rem;color:var(--muted);font-weight:700}
.tile .t{min-width:0;overflow-wrap:anywhere}
.tile.jpt .t{font-family:var(--jp);font-size:1.2rem}
.tile.sel{border-color:var(--ai);background:var(--ai-soft);box-shadow:0 4px 0 var(--ai)}
.tile.sel .k{border-color:var(--ai);color:var(--ai)}
.tile.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.tile.gone{opacity:.35;pointer-events:none;box-shadow:none}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start;min-width:0}
.match .tile{justify-content:center;text-align:center;min-height:62px}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:20px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-family:var(--jp);font-size:1.15rem;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--line);line-height:1.9}
.chip.used{visibility:hidden}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.passage summary{cursor:pointer;font-weight:700;color:var(--ai);padding:8px 0}
.passage div{font-family:var(--jp);font-size:1.02rem;line-height:2.1;padding-bottom:10px;max-height:40vh;overflow:auto}

.lfoot{position:sticky;bottom:0;border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.lfoot.ok{background:var(--ok-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.lfoot .wrap{padding-block:16px;display:grid;gap:12px}
.fb{display:none}
.lfoot.ok .fb,.lfoot.bad .fb{display:block}
.fb h4{margin:0;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.lfoot.ok .fb h4{color:var(--ok)} .lfoot.bad .fb h4{color:var(--bad)}
.fb .ans{font-family:var(--jp);font-size:1.15rem;margin-top:4px}
.fb .why{font-size:.92rem;margin-top:4px;color:var(--ink)}

/* ---------- result ---------- */
.result{text-align:center;padding-block:48px 32px}
.result .seal{width:120px;height:120px;margin:0 auto 16px;border-radius:24px;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:var(--jp);font-size:3rem;font-weight:900;transform:rotate(-8deg);box-shadow:0 8px 0 color-mix(in srgb,var(--gold) 65%,#000)}
.result .seal.fail{background:var(--bad);box-shadow:0 8px 0 var(--bad-deep)}
.result h2{font-family:var(--jp);font-size:1.9rem;margin:8px 0 2px}
.result p{color:var(--muted);margin:0 0 24px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.st{border:2px solid var(--line);border-radius:14px;padding:10px 4px;background:var(--surface)}
.st b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.st span{font-size:.78rem;color:var(--muted)}
/* ---------- 錯題本 ---------- */
.furi b{color:var(--bad);font-variant-numeric:tabular-nums}
.bk-title{margin:0;font-family:var(--jp);font-size:1.25rem;font-weight:900}
.bk-head{padding:4px 0 16px;display:grid;gap:12px}.bk-head p{margin:0;color:var(--muted)}
.bk{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:grid;gap:8px;min-width:0}
.bk-meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--ai-soft);color:var(--ai);font-weight:700;font-size:.78rem;border-radius:99px;padding:2px 10px}
.miss{color:var(--bad);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.bk-q{font-family:var(--jp);font-size:1.08rem;line-height:2;overflow-wrap:anywhere}
.bk-q .bj{font-size:1.4rem}
.bk-a{background:var(--ok-soft);border-radius:10px;padding:6px 10px;font-family:var(--jp);line-height:2;overflow-wrap:anywhere}
.bk-a b{font-family:var(--zh);color:var(--ok);font-size:.8rem;margin-right:6px}
.bk-ex{font-size:.9rem;color:var(--muted)}
.bk-rm{justify-self:start;background:none;border:0;color:var(--ai);font-weight:700;padding:4px 0}
.bk-empty{text-align:center;padding:56px 0}
.bk-empty .mark{width:96px;height:96px;margin:0 auto 14px;border-radius:22px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-family:var(--jp);font-size:2.4rem;font-weight:900}
.bk-empty h3{font-family:var(--jp);margin:0 0 4px}.bk-empty p{color:var(--muted);margin:0}
@media (max-width:430px){.brand span:last-child{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="home">
  <header class="top"><div class="wrap">
    <div class="brand"><span class="hanko">道</span><span>日文學習區</span></div>
    <div class="stat streak" title="連續天數"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.4-5.2.2 1.7.9 2.8 2.1 3.2C11 8 11 5 12 2z"/></svg><span id="sStreak">0</span></div>
    <div class="stat xp" title="經驗值"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span id="sXp">0</span></div>
    <button class="furi" id="bookBtn" title="答錯的題目">錯題本 <b id="bookN">0</b></button>
    <button class="furi" id="furiBtn" aria-pressed="true" title="顯示／隱藏假名標音">ふりがな</button>
  </div></header>
  <div class="wrap" id="pathRoot"></div>
  <div class="wrap foot-note">課本：第13課 別々に お願いします／第14課 みどり町まで お願いします／第15課 ご家族は？<br>進度只存在這個瀏覽器裡。</div>
</div>

<div id="lesson" hidden>
  <div class="lbar"><div class="wrap">
    <button class="x" id="quit" aria-label="離開練習"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="prog"><i id="progBar"></i></div>
    <div class="hearts"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.3 3.1 4.5 6.9 4.5c2.1 0 3.8 1.2 5.1 3 1.3-1.8 3-3 5.1-3 3.8 0 5.9 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg><span id="hearts">5</span></div>
  </div></div>
  <div class="qmain"><div class="wrap" id="qbody"></div></div>
  <div class="lfoot" id="lfoot"><div class="wrap">
    <div class="fb" id="fb"></div>
    <button class="btn wide" id="go" disabled>檢查</button>
  </div></div>
</div>

<div id="result" hidden><div class="wrap result" id="resBody"></div></div>

<div id="book" hidden>
  <div class="lbar"><div class="wrap">
    <button class="x" id="bookBack" aria-label="回到課程"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 class="bk-title">錯題本</h2>
  </div></div>
  <div class="wrap" id="bookBody"></div>
</div>

<div class="backdrop" id="bd" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="wrap" id="sheetBody"></div></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const rb=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\n/g,'<br>');
const plain=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'$2').replace(/[\[\]～＿]/g,'');
const base=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'$1');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const canSpeak='speechSynthesis' in window;
function speak(t){try{if(!canSpeak)return;const u=new SpeechSynthesisUtterance(plain(t));u.lang='ja-JP';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sayBtn=(t,sm)=>canSpeak?`<button class="say${sm?' sm':''}" data-say="${esc(t)}" aria-label="朗讀">${SPK}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say)}});

const TE1={'い':'って','ち':'って','り':'って','み':'んで','び':'んで','に':'んで','き':'いて','ぎ':'いで','し':'して'};
function teOf(stem,g,iku){if(g!==1)return stem+'て';const b=stem.slice(0,-1),l=stem.slice(-1);return iku?b+'って':b+TE1[l]}
function teWord(v){const sk=v.k?v.k.replace(/ます$/,''):'',sr=v.r.replace(/ます$/,'');return{k:v.k?teOf(sk,v.g,v.iku):'',r:teOf(sr,v.g,v.iku)}}
function teWrong(v){const s=(v.k||v.r).replace(/ます$/,''),b=s.slice(0,-1),c=teWord(v);const right=c.k||c.r;
  const pool=v.g===1?[s+'て',b+'って',b+'んで',b+'いて',b+'いで',b+'して']:[s+'って',s+'んで',(s.length>1?s.slice(0,-1)+'って':s+'いて'),s+'いて'];
  return shuffle([...new Set(pool)].filter(x=>x!==right&&x!==s)).slice(0,3)}
const RULE={'い':'い・ち・り → って','ち':'い・ち・り → って','り':'い・ち・り → って','み':'み・び・に → んで','び':'み・び・に → んで','に':'み・び・に → んで','き':'き → いて','ぎ':'ぎ → いで','し':'し → して'};
const E_ROW='えけげせぜてでねへべぺめれ';
function groupWhy(v){const sr=v.r.replace(/ます$/,''),l=sr.slice(-1);
  if(v.g===3)return'「します」「名詞＋します」和「来ます」是III類。';
  if(v.g===1)return`ます前面是「${l}」（い段），屬於I類。`;
  return E_ROW.includes(l)?`ます前面是「${l}」（え段），屬於II類。`:`ます前面是「${l}」雖然是い段，但它是II類，要特別記住。`}
function teWhy(v){const sr=v.r.replace(/ます$/,''),l=sr.slice(-1);
  if(v.iku)return'「行きます」是例外：不是「行いて」，而是「行って」。';

/* ================= question generation ================= */
function vocabQs(pool){
  const words=shuffle(pool),out=[];
  out.push({t:'match',pairs:pick(pool,5)});
  words.slice(0,8).forEach((w,i)=>{
    const others=pool.filter(x=>x!==w);
    const r=i%3, key='w:'+w.r;
    if(r===0) out.push({t:'mc',key,q:'這是什麼意思？',jp:jw(w),say:jw(w),c:shuffle([w.zh,...pick(others,3).map(x=>x.zh)]),a:w.zh,ex:`${jw(w)}＝${w.zh}`});
    else if(r===1) out.push({t:'mc',key,q:`「${w.zh}」的日文是？`,jpc:true,c:shuffle([jw(w),...pick(others,3).map(jw)]),a:jw(w),ex:`${jw(w)}＝${w.zh}`});
    else if(w.k){const ks=others.filter(x=>x.k);out.push({t:'mc',key,q:'這個詞怎麼唸？',jp:w.k,noruby:true,say:jw(w),jpc:true,c:shuffle([w.r,...pick(ks.length>=3?ks:others,3).map(x=>x.r)]),a:w.r,ex:`${jw(w)}＝${w.zh}`});}
    else out.push({t:'mc',key,q:'這是什麼意思？',jp:jw(w),say:jw(w),c:shuffle([w.zh,...pick(others,3).map(x=>x.zh)]),a:w.zh,ex:`${jw(w)}＝${w.zh}`});
  });
  out.push({t:'match',pairs:pick(pool,5)});
  return out;
}
const vid=v=>VB.filter(o=>o.r===v.r).length>1?v.r+'|'+v.k:v.r;
const VBM=Object.fromEntries(VB.map(v=>[vid(v),v]));
function groupQ(v){return{t:'mc',key:'g:'+vid(v),q:'這個動詞是哪一類？',jp:jw(v),say:jw(v),c:['I 類','II 類','III 類'],fixed:true,a:['I 類','II 類','III 類'][v.g-1],ex:groupWhy(v)}}
function teQ(v){const c=teWord(v),right=v.k?`{${c.k}|${c.r}}`:c.r;
  return{t:'mc',key:'te:'+vid(v),q:'て形是？',jp:jw(v),say:jw(v),jpc:true,c:shuffle([right,...teWrong(v)]),a:right,ex:teWhy(v)}}
function customQs(id){return Q[id].map((q,i)=>Object.assign({key:`c:${id}:${i}`},q))}
function byKey(k){
  if(k.startsWith('c:')){const[,id,i]=k.split(':');const q=Q[id]&&Q[id][+i];return q?Object.assign({key:k},q):null}
  if(k.startsWith('g:')){const v=VBM[k.slice(2)];return v?groupQ(v):null}
  if(k.startsWith('te:')){const v=VBM[k.slice(3)];return v?teQ(v):null}
  if(k.startsWith('w:')){const pool=[...v13a,...v13b,...v14a,...v14b,...vCity,...vStation,...v15,...vJob];const w=pool.find(x=>x.r===k.slice(2));if(!w)return null;
    const others=pool.filter(x=>x!==w);return{t:'mc',key:k,q:'這是什麼意思？',jp:jw(w),say:jw(w),c:shuffle([w.zh,...pick(others,3).map(x=>x.zh)]),a:w.zh,ex:`${jw(w)}＝${w.zh}`}}
  return null}
function buildLesson(l){
  if(l.kind==='vocab')return vocabQs(l.pool);
  if(l.kind==='group')return pick(VB,10).map(groupQ);
  if(l.kind==='te')return pick(VB.filter(v=>v.r!=='します'||true),10).map(teQ);
  if(l.kind==='custom')return l.id.startsWith('reading')?customQs(l.id):pick(customQs(l.id),Math.min(10,Q[l.id].length));
  if(l.kind==='mix'){const ids=['want','purpose','someone','request','progress','conv13','conv14','permit','state','place','conv15'];return shuffle([...pick(ids.flatMap(customQs),9),teQ(pick(VB,1)[0]),groupQ(pick(VB,1)[0])]).slice(0,12)}
  if(l.kind==='review'){const qs=shuffle(S.wrong.slice().sort((a,b)=>b.n-a.n).slice(0,12)).map(w=>byKey(w.k)).filter(Boolean);
    return qs.length?qs:pick(['want','purpose','someone','request','progress','permit','state','place'].flatMap(customQs),10)}
  return[]}

  document.body.classList.toggle('nofuri',!S.furi);$('#furiBtn').setAttribute('aria-pressed',String(!!S.furi));
  const nx=nextId(),OFF=[0,46,70,46,0,-46,-70,-46];
  $('#pathRoot').innerHTML=UNITS.map(u=>`<div class="unit ${u.cls}"><small>${u.small}</small><h2 class="jp">${rb(u.title)}</h2><p>${u.sub}</p></div>
  <div class="path">${u.lessons.map((l,i)=>{const d=S.done[l.id],st=d?'★'.repeat(d):'';
    const extra=l.kind==='review'?`（${S.wrong.length} 題）`:'';
    return`<button class="node ${d?'done':''} ${l.id===nx?'next':''}" data-l="${l.id}" style="transform:translateX(${OFF[i%8]}px)"><span class="disc">${l.g}</span><span class="stars">${st}</span><span class="lbl">${l.name}${extra}</span></button>`}).join('')}</div>`).join('');
}
$('#pathRoot').addEventListener('click',e=>{const n=e.target.closest('[data-l]');if(n)openSheet(n.dataset.l)});
$('#furiBtn').addEventListener('click',()=>{S.furi=!S.furi;save();renderHome()});

function openSheet(id){const l=LMAP[id];
  const note=l.kind==='vocab'?`<h4>單字表</h4>${vocabTable(l.pool)}`:(NOTES[id]||(l.kind==='mix'?'<p>從第13、14課的文法題中隨機出題，再加上動詞分類與て形。</p>':
    l.kind==='review'?`<p>${S.wrong.length?'答錯的題目會收進這裡，答對一次就移出。':'目前沒有錯題，會改出一組文法複習題。'}</p>`:''));
  $('#sheetBody').innerHTML=`<div class="kind">${l.g==='語'?'單字':l.g==='話'?'會話':l.g==='読'?'讀解':'練習'}</div><h3>${l.name}</h3><p class="desc">${l.desc}</p>
   <div class="row"><button class="btn" id="startBtn">開始練習</button><button class="btn ghost" id="closeSheet">關閉</button></div><div class="note">${note}</div>`;
  $('#bd').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;
  $('#startBtn').onclick=()=>{closeSheet();startLesson(id)};$('#closeSheet').onclick=closeSheet;$('#startBtn').focus()}
function closeSheet(){$('#bd').hidden=true;$('#sheet').hidden=true}
$('#bd').addEventListener('click',closeSheet);

/* ================= lesson engine ================= */
let L=null;
function startLesson(id){
  const qs=buildLesson(LMAP[id]);
  L={id,queue:qs,total:qs.length,doneCount:0,hearts:5,correct:0,tries:0,start:Date.now(),requeued:[],cur:null,phase:'answer',sel:null};
  show('lesson');window.scrollTo(0,0);nextQ()}
function setProg(){$('#progBar').style.width=(L.doneCount/L.total*100)+'%';$('#hearts').textContent=L.hearts}
function nextQ(){
  setProg();
  if(!L.queue.length)return finish(true);
  L.cur=L.queue.shift();renderQ()}
function renderQ(){
  setProg();L.phase='answer';L.sel=null;L.dead=false;
  const f=$('#lfoot');f.className='lfoot';$('#fb').innerHTML='';
  const go=$('#go');go.className='btn wide';go.textContent='檢查';go.disabled=true;
  const q=L.cur,body=$('#qbody');
  const pass=q.passage?`<details class="passage" open><summary>${PASS[q.passage].t}</summary><div>${rb(PASS[q.passage].x)}</div></details>`:'';
  if(q.t==='mc'){
    const keys='1234';
    body.innerHTML=`${pass}<div class="qtype">${q.passage?'讀解':'選擇題'}</div><h2 class="qhead">${rb(q.q)}</h2>
     ${q.jp?`<div class="prompt">${q.say||!q.noruby?sayBtn(q.say||q.jp):''}<div class="big">${q.noruby?esc(q.jp):rb(q.jp)}</div></div>`:''}
     <div class="choices">${q.c.map((c,i)=>`<button class="tile ${q.jpc||/[ぁ-んァ-ン]/.test(base(c))&&!q.passage?'jpt':''}" data-i="${i}"><span class="k">${keys[i]||''}</span><span class="t">${rb(c)}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.tile').forEach(t=>t.onclick=()=>selectMc(+t.dataset.i));
  }else if(q.t==='fill'){
    const c=shuffle(q.c);q._c=c;
    body.innerHTML=`<div class="qtype">填空</div><h2 class="qhead">選出正確的答案</h2>
     <div class="prompt">${sayBtn(q.s.replace('＿＿',q.a))}<div class="sentence">${rb(q.s).replace('＿＿','<span class="blank" id="blank">　</span>')}</div></div>
     <div class="choices two">${c.map((x,i)=>`<button class="tile jpt" data-i="${i}"><span class="k">${i+1}</span><span class="t">${rb(x)}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.tile').forEach(t=>t.onclick=()=>selectMc(+t.dataset.i));
  }else if(q.t==='build'){
    const toks=shuffle([...q.a,...(q.d||[])]);q._t=toks;L.sel=[];
    body.innerHTML=`<div class="qtype">排出句子</div><h2 class="qhead">把這句話翻成日文</h2>
     <div class="sentence" style="font-family:var(--zh);font-size:1.15rem;line-height:1.7">${q.zh}</div>
     <div class="answer-line" id="aline"></div><div class="bank" id="bank">${toks.map((x,i)=>`<button class="chip" data-i="${i}">${rb(x)}</button>`).join('')}</div>`;
    $('#bank').onclick=e=>{const c=e.target.closest('.chip');if(!c||L.phase!=='answer'||c.classList.contains('used'))return;
      const i=+c.dataset.i;L.sel.push(i);c.classList.add('used');speak(toks[i]);drawLine()};
    $('#aline').onclick=e=>{const c=e.target.closest('.chip');if(!c||L.phase!=='answer')return;
      const i=+c.dataset.i;L.sel=L.sel.filter(x=>x!==i);$(`#bank .chip[data-i="${i}"]`).classList.remove('used');drawLine()};
  }else if(q.t==='match'){
    const left=shuffle(q.pairs),right=shuffle(q.pairs);q._m={left,right,a:null,b:null,left_n:q.pairs.length,miss:0};
    body.innerHTML=`<div class="qtype">配對</div><h2 class="qhead">把日文和中文配成一對</h2>
     <div class="match"><div class="col">${left.map(w=>`<button class="tile jpt" data-side="a" data-r="${esc(w.r)}"><span class="t">${rb(jw(w))}</span></button>`).join('')}</div>
     <div class="col">${right.map(w=>`<button class="tile" data-side="b" data-r="${esc(w.r)}"><span class="t">${w.zh}</span></button>`).join('')}</div></div>`;
    body.querySelector('.match').onclick=e=>{const t=e.target.closest('.tile');if(t)tapMatch(t)};
    go.textContent='配對完成後繼續';
  }
  persist();
}
function drawLine(){const q=L.cur;$('#aline').innerHTML=L.sel.map(i=>`<button class="chip" data-i="${i}">${rb(q._t[i])}</button>`).join('');$('#go').disabled=!L.sel.length}
function selectMc(i){if(L.phase!=='answer')return;L.sel=i;
  $('#qbody').querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',+t.dataset.i===i));
  const q=L.cur;
  if(q.t==='fill'){$('#blank').innerHTML=rb(q._c[i])}
  if(q.t==='mc'&&q.jpc)speak(q.c[i]);
  $('#go').disabled=false}
function tapMatch(t){const m=L.cur._m;if(t.classList.contains('gone'))return;const side=t.dataset.side;
  if(side==='a')speak(t.dataset.r);
  $('#qbody').querySelectorAll(`.tile[data-side="${side}"]`).forEach(x=>x.classList.remove('sel'));t.classList.add('sel');m[side]=t;
  if(m.a&&m.b){const A=m.a,Bt=m.b;m.a=m.b=null;
    if(A.dataset.r===Bt.dataset.r){[A,Bt].forEach(x=>{x.classList.remove('sel');x.classList.add('right');setTimeout(()=>{x.classList.remove('right');x.classList.add('gone')},350)});
      if(--m.left_n===0){L.correct++;L.tries++;L.doneCount++;L.phase='done';setTimeout(()=>{showFb(true,'全部配對完成！','');},400)}}
    else{m.miss++;[A,Bt].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong','shake');setTimeout(()=>x.classList.remove('wrong','shake'),450)})}}}
function check(){
  const q=L.cur;let ok=false,ansHtml='';
  if(q.t==='mc'){const chosen=q.c[L.sel];ok=chosen===q.a;
    $('#qbody').querySelectorAll('.tile').forEach(t=>{const c=q.c[+t.dataset.i];if(c===q.a)t.classList.add('right');else if(+t.dataset.i===L.sel)t.classList.add('wrong')});
    ansHtml=rb(q.a)}
  else if(q.t==='fill'){ok=q._c[L.sel]===q.a;
    $('#qbody').querySelectorAll('.tile').forEach(t=>{const c=q._c[+t.dataset.i];if(c===q.a)t.classList.add('right');else if(+t.dataset.i===L.sel)t.classList.add('wrong')});
    $('#blank').innerHTML=rb(q.a);ansHtml=rb(q.s.replace('＿＿',q.a));speak(q.s.replace('＿＿',q.a))}
  else if(q.t==='build'){const got=L.sel.map(i=>base(q._t[i])).join('').replace(/\s/g,''),want=q.a.map(base).join('').replace(/\s/g,'');ok=got===want;
    ansHtml=rb(q.a.join(' '));speak(q.a.join(''))}
  L.tries++;L.phase='done';
  if(ok){L.correct++;L.doneCount++;if(q.key&&LMAP[L.id].kind==='review')S.wrong=S.wrong.filter(w=>w.k!==q.key)}
  else{L.hearts--;
    if(q.key){const w=S.wrong.find(w=>w.k===q.key);if(w){w.n++;w.t=Date.now()}else S.wrong.push({k:q.key,n:1,t:Date.now()})}
    if(!L.requeued.includes(q.key)){L.requeued.push(q.key);L.queue.push(q)}else L.doneCount++;}
  save();setProg();persist();showFb(ok,ok?pickPraise():'正確答案：',ansHtml,q.ex)}
const PRAISE=['すばらしい！','いいですね！','正解！','その調子！','よくできました！'];
const pickPraise=()=>PRAISE[Math.random()*PRAISE.length|0];
function showFb(ok,title,ans,why){
  const f=$('#lfoot');f.className='lfoot '+(ok?'ok':'bad');
  const icon=ok?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  $('#fb').innerHTML=`<h4 class="jp">${icon}${title}</h4>${ans&&!ok?`<div class="ans">${ans}</div>`:''}${why?`<div class="why">${rb(why)}</div>`:''}`;
  const go=$('#go');go.disabled=false;go.textContent='繼續';go.className='btn wide '+(ok?'ok':'bad');go.focus({preventScroll:true});
  L.phase='fb';if(L.hearts<=0)L.dead=true}
$('#go').addEventListener('click',()=>{if(!L)return;
  if(L.phase==='answer'&&L.cur.t!=='match')return check();
  if(L.phase==='fb'){if(L.dead)return finish(false);nextQ()}});
$('#quit').addEventListener('click',()=>{L=null;try{speechSynthesis.cancel()}catch(e){}renderHome();show('home')});
document.addEventListener('keydown',e=>{if(!L||$('#lesson').hidden)return;
  if(e.key==='Enter'){e.preventDefault();$('#go').click();return}
  if(L.phase==='answer'&&/^[1-4]$/.test(e.key)&&(L.cur.t==='mc'||L.cur.t==='fill')){const i=+e.key-1;if(i<(L.cur.c.length))selectMc(i)}});

function finish(won){
  const secs=Math.round((Date.now()-L.start)/1000),acc=L.tries?Math.round(L.correct/L.tries*100):0;
  let gained=0;
  if(won){gained=10+L.hearts*2;S.xp+=gained;const stars=L.hearts>=5?3:L.hearts>=3?2:1;S.done[L.id]=Math.max(S.done[L.id]||0,stars);
    const t=day(),y=day(new Date(Date.now()-864e5));if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}save()}
  show('result');window.scrollTo(0,0);
  $('#resBody').innerHTML=won?`<div class="seal">合格</div><h2>よくできました！</h2><p>${LMAP[L.id].name}　完成</p>
    <div class="tiles3"><div class="st"><b style="color:var(--gold)">+${gained}</b><span>經驗值</span></div><div class="st"><b style="color:var(--ok)">${acc}%</b><span>正確率</span></div><div class="st"><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>用時</span></div></div>
    <button class="btn wide" id="resGo">繼續</button>`
   :`<div class="seal fail">再</div><h2>ハートが なくなりました</h2><p>愛心用完了。看一下筆記再試一次吧。</p>
    <div class="row" style="justify-content:center"><button class="btn" id="resRetry">再試一次</button><button class="btn ghost" id="resGo">回到課程</button></div>`;
  const id=L.id;L=null;
  $('#resGo').onclick=()=>{renderHome();show('home')};
  const r=$('#resRetry');if(r)r.onclick=()=>startLesson(id)}

/* ================= 錯題本 ================= */
const CAT=k=>k.startsWith('c:')?((LMAP[k.split(':')[1]]||{}).name||'文法'):k.startsWith('w:')?'單字':k.startsWith('g:')?'動詞分類':'て形';
const qText=q=>q.t==='fill'?rb(q.s.replace('＿＿','（　）')):q.t==='build'?esc(q.zh):rb(q.q)+(q.jp?`<div class="bj">${q.noruby?esc(q.jp):rb(q.jp)}</div>`:'');
const aText=q=>q.t==='fill'?rb(q.s.replace('＿＿',q.a)):q.t==='build'?rb(q.a.join(' ')):rb(q.a);
function renderBook(){
  const items=S.wrong.map(w=>({w,q:byKey(w.k)})).filter(x=>x.q).sort((a,b)=>b.w.n-a.w.n||b.w.t-a.w.t);
  $('#bookBody').innerHTML=items.length?`<div class="bk-head"><p>共 ${items.length} 題答錯過的題目，錯最多次的排在前面。複習時答對一次就會移除。</p><button class="btn wide" id="bookStart">開始複習（${Math.min(12,items.length)} 題）</button></div>`+
    items.map(({w,q})=>`<article class="bk"><div class="bk-meta"><span class="pill">${CAT(w.k)}</span><span class="miss">錯 ${w.n} 次</span></div>
      <div class="bk-q">${qText(q)}</div><div class="bk-a"><b>答案</b>${aText(q)}</div>${q.ex?`<div class="bk-ex">${rb(q.ex)}</div>`:''}
      <button class="bk-rm" data-rm="${esc(w.k)}">我學會了，移除</button></article>`).join('')
   :`<div class="bk-empty"><div class="mark">空</div><h3>還沒有錯題</h3><p>練習時答錯的題目會自動存在這裡，之後可以集中複習。</p></div>`;
}
$('#bookBtn').addEventListener('click',()=>{renderBook();show('book');window.scrollTo(0,0)});
$('#bookBack').addEventListener('click',()=>{renderHome();show('home')});
$('#bookBody').addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');if(rm){S.wrong=S.wrong.filter(w=>w.k!==rm.dataset.rm);save();renderBook();return}
  if(e.target.closest('#bookStart'))startLesson('review')});

/* ================= views & resume ================= */
let VIEW='home';
function show(v){VIEW=v;['home','lesson','result','book'].forEach(x=>$('#'+x).hidden=x!==v);persist()}
const snap=()=>({view:VIEW,L:L?JSON.parse(JSON.stringify(L,(k,v)=>v instanceof Element?null:v)):null,y:window.scrollY});
function persist(){try{sessionStorage.setItem(KEY+':view',JSON.stringify(snap()))}catch(e){}}
window.addEventListener('pagehide',persist);
function boot(data){
  let d=data&&data.view?data:null;
  if(!d){try{d=JSON.parse(sessionStorage.getItem(KEY+':view')||'null')}catch(e){}}
  renderHome();
  if(d&&d.view==='lesson'&&d.L&&d.L.cur){L=d.L;show('lesson');renderQ()}
  else if(d&&d.view==='book'){renderBook();show('book')}
  else show('home');
  if(d&&d.y&&d.view!=='lesson')requestAnimationFrame(()=>window.scrollTo(0,d.y));
}
try{window.claude?.hot?.snapshot?.(snap)}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
</script>

</body>
